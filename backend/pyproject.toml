[project]
name = "backend"
version = "0.1.0"
description = "Crypto Wallet -> VASP Attribution Engine (SIH26182)"
readme = "README.md"
authors = [
    { name = "qonstellations", email = "aarush.a.pathak@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "neo4j>=5.0",
    "networkx>=3.6.1",
    "python-dotenv>=1.2.3",
    "reportlab>=5.0.1",
    "uvicorn[standard]>=0.34.3",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "core", "services", "scripts"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# Run from backend/:  uv run pytest
# The suites import `app`, `core` and `services` as top-level packages.
testpaths = ["tests"]
pythonpath = ["."]

